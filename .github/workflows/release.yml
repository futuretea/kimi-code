name: Release

on:
  push:
    branches: ['tea/moonshot-240']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'futuretea/kimi-code' && github.ref == 'refs/heads/tea/moonshot-240'
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        id: version
        with:
          version: pnpm run version:release
          commit: 'ci: release packages'
          title: 'ci: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check version PR
        if: steps.version.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_BRANCH: changeset-release/${{ github.ref_name }}
        run: gh workflow run ci.yml --ref "$VERSION_BRANCH"

  candidate:
    if: github.repository == 'futuretea/kimi-code' && github.event_name == 'push' && github.ref == 'refs/heads/tea/moonshot-240'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    outputs:
      publish: ${{ steps.trigger.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Wait for merged version commit CI
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-trigger.mjs

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: candidate
    if: needs.candidate.outputs.publish == 'true'
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Required for NPM Trusted Publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Kimi Code built-in catalog
        shell: bash
        run: |
          CATALOG_FILE="$RUNNER_TEMP/kimi-code-built-in-catalog.json"
          node apps/kimi-code/scripts/update-catalog.mjs --out "$CATALOG_FILE"
          echo "KIMI_CODE_BUILT_IN_CATALOG_FILE=$CATALOG_FILE" >> "$GITHUB_ENV"

      - name: Build packages
        run: pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm run version:release
          commit: "ci: release packages"
          title: "ci: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN is not needed with Trusted Publishing (OIDC)
